version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: barberflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: barberflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: barberflow
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barberflow']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: barberflow_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: barberflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: barberflow_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barberflow']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: barberflow_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
